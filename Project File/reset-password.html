<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jarhead Lab Task Hub — Reset Password</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <main class="login-card">
    <h1>Reset Password</h1>
    <p class="subtitle">Enter a new password for your account</p>

    <form id="resetForm">
      <label>
        New password
        <input id="newPassword" type="password" required minlength="6" autocomplete="new-password" />
      </label>
      <label>
        Confirm new password
        <input id="confirmPassword" type="password" required minlength="6" autocomplete="new-password" />
      </label>
      <button type="submit">Update Password</button>
    </form>

    <p id="resetMessage" class="auth-message hidden"></p>
    <p class="hint"><a href="index.html" style="color: var(--accent);">Back to sign in</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      const form = document.getElementById('resetForm');
      const msg  = document.getElementById('resetMessage');

      function show(text, kind) {
        msg.textContent = text;
        msg.className = 'auth-message ' + kind;
        msg.classList.remove('hidden');
      }

      // Supabase JS picks up the recovery token from the URL hash automatically.
      // We just need a valid session before calling updateUser.
      sb.auth.getSession().then(({ data }) => {
        if (!data.session) {
          show('This reset link is invalid or expired. Request a new one from the sign-in page.', 'error');
          form.querySelector('button').disabled = true;
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.classList.add('hidden');
        const a = document.getElementById('newPassword').value;
        const b = document.getElementById('confirmPassword').value;
        if (a !== b) { show("Passwords don't match.", 'error'); return; }

        const { error } = await sb.auth.updateUser({ password: a });
        if (error) { show(error.message, 'error'); return; }

        show('Password updated. Redirecting to sign in…', 'success');
        await sb.auth.signOut();
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
      });
    })();
  </script>
</body>
</html>
